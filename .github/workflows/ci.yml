name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t events-api:latest .

      - name: Start container
        run: docker run -d --name events-api -p 5000:5000 events-api:latest

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs events-api
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest requests

      - name: Run tests
        run: pytest -v

      - name: Stop and remove container
        if: always()
        run: docker rm -f events-api
